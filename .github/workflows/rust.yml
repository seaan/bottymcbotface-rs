name: Rust

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottymcbotface-rs
          path: target/x86_64-unknown-linux-musl/release/bottymcbotface-rs
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-musl

      - name: Build aarch64 musl binary
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottymcbotface-rs-aarch64
          path: target/aarch64-unknown-linux-musl/release/bottymcbotface-rs
          if-no-files-found: error

  release:
    needs: [build, build-aarch64]
    runs-on: ubuntu-latest

    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bottymcbotface-rs
          path: ./release

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bottymcbotface-rs-aarch64
          path: ./release-aarch64

      - name: Rename aarch64 binary
        run: mv ./release-aarch64/bottymcbotface-rs ./release/bottymcbotface-rs-aarch64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            ./release/bottymcbotface-rs
            ./release/bottymcbotface-rs-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
