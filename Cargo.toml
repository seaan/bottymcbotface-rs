[package]
name = "bottymcbotface-rs"
version = "1.0.0"
authors = ["Sean Widmier <seanwidmier@gmail.com>"]
edition = "2021"

[dependencies]
# Discord bot framework
serenity = { version = "*", features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }

# Asynchronous runtime
tokio = { version = "*", features = ["macros", "rt-multi-thread"] }

# Command framework
poise = "*"

# Logging
env_logger = "*"
log = "*"
tracing = "*"
tracing-subscriber = "*"

# Environment configuration
dotenv = "*"

# Random number generation
rand = "*"

chrono = "*"
futures = "*"
sqlx = {version = "*", features = ["runtime-tokio", "sqlite"] }
lazy_static = "*"
regex = "*"
