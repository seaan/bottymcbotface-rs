[package]
name = "bottymcbotface-rs"
version = "1.0.0"
authors = ["Sean Widmier <seanwidmier@gmail.com>"]
edition = "2024"

[dependencies]
# Discord bot framework
serenity = { version = "*", features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }

# Asynchronous runtime
tokio = { version = "*", features = ["macros", "rt-multi-thread", "net"] }

# Command framework
poise = "*"

# Logging
env_logger = "*"
log = "*"
tracing = "*"
tracing-subscriber = "*"

# Environment configuration
dotenv = "*"

# Random number generation
rand = "*"

chrono = "*"
futures = "*"
sqlx = {version = "*", features = ["runtime-tokio", "sqlite"] }
lazy_static = "*"
regex = "*"
axum = { version = "0.8", features = ["json", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
uuid = { version = "1.11", features = ["v4"] }
